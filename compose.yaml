services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: bandeja
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bandeja}
      POSTGRES_DB: bandeja
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bandeja -d bandeja"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"

  app:
    build: ./core
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://bandeja:${POSTGRES_PASSWORD:-bandeja}@db:5432/bandeja
      PORT: "3000"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"

volumes:
  pgdata:
