services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: viborea
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-viborea}
      POSTGRES_DB: viborea
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viborea -d viborea"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${NUXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-${VITE_CLERK_PUBLISHABLE_KEY:-}}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://viborea:${POSTGRES_PASSWORD:-viborea}@db:5432/viborea
      PORT: "8080"
      CLERK_SECRET_KEY: ${NUXT_CLERK_SECRET_KEY:-${CLERK_SECRET_KEY:-}}
      # Signs player cookies and WhatsApp manage links. Boot fails without it
      # in production: the fallback would be a constant published in this repo.
      PLAYER_COOKIE_SECRET: ${PLAYER_COOKIE_SECRET:?PLAYER_COOKIE_SECRET es obligatorio}
      PLAYER_COOKIE_SECRET_OLD: ${PLAYER_COOKIE_SECRET_OLD:-}
      WHATSAPP_TEST_TOKEN: ${WHATSAPP_TEST_TOKEN:-}
      WHATSAPP_TEST_PHONE_NUMBER_ID: ${WHATSAPP_TEST_PHONE_NUMBER_ID:-}
      APP_URL: ${APP_URL:-https://viborea.com}
      # Rewrites the DG roster and drops that academy's planilla: opt in only.
      SEED_ALIGN_DG: ${SEED_ALIGN_DG:-0}
      PILOTO_ENABLED: ${PILOTO_ENABLED:-0}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"
    networks:
      - internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=viborea
      - traefik.http.routers.viborea.rule=Host(`viborea.com`) || Host(`www.viborea.com`)
      - traefik.http.routers.viborea.entrypoints=web
      - traefik.http.routers.viborea.middlewares=redirect-to-https@file
      - traefik.http.routers.viborea.priority=10
      - traefik.http.routers.viborea.service=viborea
      - traefik.http.services.viborea.loadbalancer.server.port=8080
      - traefik.http.routers.viboreasecure.rule=Host(`viborea.com`) || Host(`www.viborea.com`)
      - traefik.http.routers.viboreasecure.entrypoints=websecure
      - traefik.http.routers.viboreasecure.tls=true
      - traefik.http.routers.viboreasecure.priority=10
      - traefik.http.routers.viboreasecure.service=viboreasecure
      - traefik.http.services.viboreasecure.loadbalancer.server.port=8080

  backup:
    image: postgres:18
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: viborea
      PGDATABASE: viborea
      PGPASSWORD: ${POSTGRES_PASSWORD:-viborea}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./ops/pg-backup.sh:/usr/local/bin/pg-backup.sh:ro
      - backups:/backups
    entrypoint: ["/bin/sh", "/usr/local/bin/pg-backup.sh"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

volumes:
  pgdata:
    name: viborea_pgdata
  backups:
    name: viborea_backups

networks:
  internal:
    name: viborea
    external: true
