services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: bandeja
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bandeja}
      POSTGRES_DB: bandeja
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bandeja -d bandeja"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"

  app:
    build: ./core
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://bandeja:${POSTGRES_PASSWORD:-bandeja}@db:5432/bandeja
      PORT: "8080"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"
    labels:
      - traefik.enable=true
      - traefik.docker.network=bandeja-2ryryu
      - traefik.http.routers.viborea-book.rule=(Host(`viborea.com`) || Host(`www.viborea.com`)) && PathPrefix(`/reservar`)
      - traefik.http.routers.viborea-book.entrypoints=web
      - traefik.http.routers.viborea-book.middlewares=redirect-to-https@file
      - traefik.http.routers.viborea-book.priority=200
      - traefik.http.routers.viborea-book.service=viborea-book
      - traefik.http.services.viborea-book.loadbalancer.server.port=8080
      - traefik.http.routers.viborea-booksecure.rule=(Host(`viborea.com`) || Host(`www.viborea.com`)) && PathPrefix(`/reservar`)
      - traefik.http.routers.viborea-booksecure.entrypoints=websecure
      - traefik.http.routers.viborea-booksecure.tls=true
      - traefik.http.routers.viborea-booksecure.priority=200
      - traefik.http.routers.viborea-booksecure.service=viborea-booksecure
      - traefik.http.services.viborea-booksecure.loadbalancer.server.port=8080

  web:
    build: ./web
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NUXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
      NUXT_CLERK_SECRET_KEY: ${NUXT_CLERK_SECRET_KEY:-}
      PORT: "8081"
      NITRO_PORT: "8081"
      NITRO_HOST: "0.0.0.0"
    expose:
      - "8081"

volumes:
  pgdata:
