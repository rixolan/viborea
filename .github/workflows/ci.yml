name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  whatsapp:
    name: WhatsApp Cloud API client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - run: bun install --frozen-lockfile
        working-directory: core
      - run: bunx tsc --noEmit -p tsconfig.json
        working-directory: core
      - run: bun test src/whatsapp
        working-directory: core

  agent-bot:
    name: Chatwoot AgentBot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - run: bun install --frozen-lockfile
        working-directory: workers/chatwoot-agent-bot
      - run: bun test
        working-directory: workers/chatwoot-agent-bot
